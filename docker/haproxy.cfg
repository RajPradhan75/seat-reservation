global
    log stdout format raw local0
    maxconn 25000
    nbthread 1
    tune.bufsize 8192
    tune.maxrewrite 1024

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client 180s
    timeout server 180s
    timeout queue 180s
    timeout http-request 30s
    timeout http-keep-alive 5s

frontend api
    bind :__PORT__ backlog 25000
    # Readiness remains a real Spring/DB check; never synthesize a healthy response.
    acl write_method method POST PUT PATCH DELETE
    use_backend booking_writes if write_method
    default_backend reads_and_health

backend booking_writes
    server spring 127.0.0.1:8081 maxconn 12

backend reads_and_health
    server spring 127.0.0.1:8081 maxconn 4
