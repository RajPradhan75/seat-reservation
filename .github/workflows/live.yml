name: Verify public Render service
on:
  workflow_dispatch:
    inputs:
      transport:
        description: HTTP transport for the public burst
        type: choice
        options: [http1, http2]
        default: http1
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET: ${{ secrets.LIVE_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public reservation lifecycle
        run: python3 scripts/smoke.py https://seat-reservation-api-osgz.onrender.com
      - name: Run a 10-user public demo
        run: |
          set -o pipefail
          mkdir -p evidence
          transport_args=()
          if [ '${{ inputs.transport }}' = http2 ]; then transport_args+=(--http2); fi
          ./burst.sh https://seat-reservation-api-osgz.onrender.com --requests 10 --concurrency 10 "${transport_args[@]}" | tee evidence/live-burst.jsonl
      - name: Capture public observability
        if: always()
        run: |
          mkdir -p evidence
          curl --max-time 90 -fsS https://seat-reservation-api-osgz.onrender.com/metrics > evidence/live-metrics.prom
          curl --max-time 90 -fsS https://seat-reservation-api-osgz.onrender.com/logs > evidence/live-logs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-verification-evidence
          path: evidence/
