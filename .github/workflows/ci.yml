name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize local container secrets
        run: ./scripts/setup-env.sh
      - name: Real PostgreSQL integration and API tests
        run: ./mvnw -B clean verify
      - name: Configure Docker networking for the connection storm
        run: |
          sudo python3 - <<'PYCODE'
          import json
          from pathlib import Path
          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text()) if path.exists() else {}
          config["userland-proxy"] = False
          path.write_text(json.dumps(config))
          PYCODE
          sudo systemctl restart docker
      - name: Build and start containers
        run: |
          ./scripts/setup-env.sh
          docker compose up --build -d
      - name: Check startup and reservation lifecycle
        run: python3 scripts/smoke.py http://localhost:8080
      - name: HTTP concurrency check
        run: |
          set -o pipefail
          mkdir -p evidence
          ./burst.sh http://localhost:8080 --requests 10 --concurrency 10 | tee evidence/burst.jsonl
      - name: Check dependency failure
        run: |
          docker compose stop db
          python3 scripts/smoke.py http://localhost:8080 --expect-db-down
      - name: Check dependency recovery
        run: |
          docker compose start db
          python3 scripts/smoke.py http://localhost:8080
      - name: Container diagnostics
        if: always()
        run: |
          mkdir -p evidence
          sudo journalctl -u docker --no-pager -n 100 > evidence/docker-daemon.log
          sudo dmesg -T | tail -100 > evidence/kernel.log
          docker compose ps -a > evidence/container-state.txt
          docker inspect $(docker compose ps -aq) --format '{{.Name}} {{json .State}}' >> evidence/container-state.txt
          docker compose logs --no-color > evidence/container.log
          tail -150 evidence/container.log
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            target/surefire-reports/
            evidence/
      - name: Stop containers
        if: always()
        run: docker compose down
